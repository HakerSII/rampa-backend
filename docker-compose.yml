# docker compose up -d --build   →  API http://localhost:8000/docs, MCP http://localhost:8080/mcp, Postgres localhost:5432
# Values come from .env in this folder (compose interpolation) with safe defaults below.
name: rampa

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rampa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rampa}
      POSTGRES_DB: ${POSTGRES_DB:-rampa}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # storage → Postgres service
      REPO_MODE: sql
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-rampa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rampa}
      POSTGRES_DB: ${POSTGRES_DB:-rampa}
      # auth
      AUTH_MODE: ${AUTH_MODE:-demo}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # demo / open API
      DEMO_NOW: ${DEMO_NOW:-}
      PUBLIC_API_KEYS: ${PUBLIC_API_KEYS:-demo-key}
      PUBLIC_RATE_LIMIT_PER_MIN: ${PUBLIC_RATE_LIMIT_PER_MIN:-60}
      # AI (onnx not supported in this image: no GPU/model) → mock | gemini
      AI_MODE: ${AI_MODE:-mock}
      AI_TIMEOUT_S: ${AI_TIMEOUT_S:-60}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      # F30/F40 recommendations: rules | claude | gemini
      AI_RECOMMENDER: ${AI_RECOMMENDER:-rules}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      # F33 e-mail login: console (log) | smtp
      MAILER: ${MAILER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@rampa.local}
      EMAIL_LINK_URL: ${EMAIL_LINK_URL:-}
      # F27/F28/F37 live OSM + city
      GEOCODER: ${GEOCODER:-local}
      ROUTER: ${ROUTER:-straight}
      CITY_CONFIG: ${CITY_CONFIG:-}
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # F41 remote MCP (Streamable HTTP) — client of the api's Open API; docs/mcp.md
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MCP_PORT:-8080}:8080"
    # own env file of the MCP service (RAMPA_API_KEY, MCP_AUTH_TOKEN …); optional — defaults work without it
    env_file:
      - path: .mcpenv
        required: false
    environment:
      # wiring inside compose wins over .mcpenv
      RAMPA_API_URL: http://api:8000
      MCP_TRANSPORT: http
      PORT: 8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  media:
