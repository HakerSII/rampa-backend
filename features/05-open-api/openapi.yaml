openapi: 3.1.0
info:
  title: Kraków bez barier — MVP — F5 Open API
  version: 0.1.0-mvp
  description: >
    Read-only public API for external apps. Subset of ../../../openapi.yaml (tag public).
    Requires X-Api-Key. Rate limit per key (default 60 req/min) → 429.
servers:
  - url: http://localhost:8000
security:
  - apiKey: []
tags:
  - name: public
paths:
  /public/v1/places:
    get:
      tags: [public]
      summary: Places (same filters as internal search)
      operationId: publicSearchPlaces
      parameters:
        - name: features
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: "#/components/schemas/FeatureKey" } }
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPlacePage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /public/v1/places/{placeId}:
    parameters: [{ $ref: "#/components/parameters/PlaceId" }]
    get:
      tags: [public]
      summary: Place
      operationId: publicGetPlace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPlace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /public/v1/places/{placeId}/accessibility:
    parameters: [{ $ref: "#/components/parameters/PlaceId" }]
    get:
      tags: [public]
      summary: Accessibility, flat format (yes → true, no → false, unknown omitted)
      operationId: publicGetAccessibility
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicAccessibility" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /public/v1/places/{placeId}/check:
    parameters: [{ $ref: "#/components/parameters/PlaceId" }]
    get:
      tags: [public]
      summary: '"Can I get in?" for a needs profile'
      operationId: publicCheckPlace
      parameters:
        - name: profile
          in: query
          required: true
          schema: { type: string, enum: [wheelchair, crutches, stroller, blind, low_vision, deaf, assistance_dog] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    PlaceId:
      name: placeId
      in: path
      required: true
      schema: { type: string, examples: [plc_mnk] }
  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: UNAUTHORIZED (missing or unknown X-Api-Key)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: RATE_LIMITED
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the window resets
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [VALIDATION_ERROR, UNAUTHORIZED, NOT_FOUND, RATE_LIMITED] }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    FeatureKey:
      type: string
      enum: [step_free_entrance, ramp, elevator, accessible_toilet, induction_loop, braille, tactile_paths, good_lighting, lowered_curb, platform_elevator, crutches_friendly, sign_language_interpreter, assistance_dog_allowed, elevator_entrance, wide_doors, automatic_doors, call_bell, spacious_interior, high_contrast_info, tactile_info, escalator, adult_changing_table, turning_space, extra_accessible_toilets, high_contrast_markings, accessible_digital_materials, audio_description, video_captions, fm_system, disabled_parking, marked_parking, level_surface, more_than_n_spots, drop_off_zone, pets_allowed]
    Location:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number }
        lon: { type: number }
    PublicPlace:
      type: object
      required: [id, name, location]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        address: { type: string }
        location: { $ref: "#/components/schemas/Location" }
        accessibility_summary:
          type: array
          items: { $ref: "#/components/schemas/FeatureKey" }
          description: Features with state yes
    PublicPlacePage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PublicPlace" } }
        total: { type: integer }
    PublicFeature:
      type: object
      required: [value]
      properties:
        value: { type: boolean }
        temporary: { type: boolean }
        confidence: { type: number }
        last_verified: { type: [string, "null"], format: date }
    PublicAccessibility:
      type: object
      properties:
        place:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        accessibility:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PublicFeature" }
    PublicCheck:
      type: object
      properties:
        place_id: { type: string }
        profile: { type: string }
        answer: { type: string, enum: ["yes", partial, "no", unknown] }
        confidence: { type: number }
        advice: { type: string }
