openapi: 3.1.0
info:
  title: Kraków bez barier — MVP — F7 Owner
  version: 0.1.0-mvp
  description: >
    Owner role + verified_owner observations (trust weight 0.85). Owner adds
    observations, never overwrites state or user reports. Subset of ../../../openapi.yaml (tag owner)
    + admin owner assignment.
servers:
  - url: http://localhost:8000/api/v1
security:
  - bearerAuth: []
tags:
  - name: owner
  - name: admin
paths:
  /owner/places:
    get:
      tags: [owner]
      summary: My places (owner only)
      operationId: listOwnerPlaces
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PlaceSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /owner/places/{placeId}/observations:
    parameters: [{ $ref: "#/components/parameters/PlaceId" }]
    post:
      tags: [owner]
      summary: Batch update as verified_owner observations ("Zaktualizuj dane")
      operationId: addOwnerObservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observations]
              properties:
                observations:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { $ref: "#/components/schemas/ObservationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Observation" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /owner/reports:
    get:
      tags: [owner]
      summary: User reports on my places (newest first)
      operationId: listOwnerReports
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Report" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/places/{placeId}/owner:
    parameters: [{ $ref: "#/components/parameters/PlaceId" }]
    post:
      tags: [admin]
      summary: Assign owner (user → promoted to owner)
      operationId: assignOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, examples: [usr_anna] }
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  place_id: { type: string }
                  owner:
                    type: object
                    properties:
                      id: { type: string }
                      display_name: { type: string }
                      role: { type: string, enum: [owner, admin] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    PlaceId: { name: placeId, in: path, required: true, schema: { type: string, examples: [plc_mnk] } }
  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: UNAUTHORIZED
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: FORBIDDEN (not an owner / not owner of this place / not admin)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND] }
            message: { type: string }
    FeatureKey:
      type: string
      enum: [step_free_entrance, ramp, elevator, accessible_toilet, induction_loop, braille, tactile_paths, good_lighting, lowered_curb, platform_elevator, crutches_friendly, sign_language_interpreter, assistance_dog_allowed]
    ObservationSource:
      type: string
      enum: [community, verified_owner, admin]
    PlaceSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        accessibility_summary: { type: array, items: { $ref: "#/components/schemas/FeatureKey" } }
    ObservationInput:
      type: object
      required: [feature, value]
      properties:
        feature: { $ref: "#/components/schemas/FeatureKey" }
        value: { type: string, enum: ["yes", "no"] }
        temporary: { type: boolean, default: false }
        comment: { type: string }
        photo_ids: { type: array, items: { type: string }, maxItems: 5 }
    Observation:
      type: object
      properties:
        id: { type: string }
        feature: { $ref: "#/components/schemas/FeatureKey" }
        value: { type: string, enum: ["yes", "no"] }
        source: { $ref: "#/components/schemas/ObservationSource" }
        confidence: { type: number }
        validation:
          type: object
          properties:
            status: { type: string, enum: [VALID, CONFLICT, REJECTED] }
    Report:
      type: object
      properties:
        id: { type: string }
        place_id: { type: string }
        element: { $ref: "#/components/schemas/FeatureKey" }
        current_state: { type: string, enum: [works, not_working] }
        severity: { type: string, enum: [critical, obstacle, minor] }
        description: { type: string }
        created_at: { type: string, format: date-time }
