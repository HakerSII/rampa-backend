openapi: 3.1.0
info:
  title: Kraków bez barier — MVP — F2 Places, search, check
  version: 0.1.0-mvp
  description: Subset of ../../../openapi.yaml. Public read endpoints (guest allowed).
servers:
  - url: http://localhost:8000/api/v1
tags:
  - name: places
  - name: dictionaries
paths:
  /places:
    get:
      tags: [places]
      summary: Search places (features = AND, state must be yes)
      operationId: searchPlaces
      parameters:
        - name: features
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: "#/components/schemas/FeatureKey" } }
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacePage" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /places/{placeId}:
    parameters: [{ $ref: "#/components/parameters/PlaceId" }]
    get:
      tags: [places]
      summary: Place details
      operationId: getPlace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }
        "404": { $ref: "#/components/responses/NotFound" }
  /places/{placeId}/accessibility:
    parameters: [{ $ref: "#/components/parameters/PlaceId" }]
    get:
      tags: [places]
      summary: Current (computed) accessibility state, grouped
      operationId: getAccessibility
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accessibility" }
        "404": { $ref: "#/components/responses/NotFound" }
  /places/{placeId}/check:
    parameters: [{ $ref: "#/components/parameters/PlaceId" }]
    get:
      tags: [places]
      summary: '"Can I get in?" for a needs profile'
      operationId: checkPlace
      parameters:
        - name: profile
          in: query
          required: true
          schema: { $ref: "#/components/schemas/NeedsProfile" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }
        "404": { $ref: "#/components/responses/NotFound" }
  /accessibility/features:
    get:
      tags: [dictionaries]
      summary: Feature dictionary (filters)
      operationId: listFeatures
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: { $ref: "#/components/schemas/FeatureGroupKey" }
                    label: { type: string }
                    features:
                      type: array
                      items:
                        type: object
                        properties:
                          key: { $ref: "#/components/schemas/FeatureKey" }
                          label: { type: string }
components:
  parameters:
    PlaceId:
      name: placeId
      in: path
      required: true
      schema: { type: string, examples: [plc_mnk] }
  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: NOT_FOUND
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT] }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    FeatureKey:
      type: string
      enum: [step_free_entrance, ramp, elevator, accessible_toilet, induction_loop, braille, tactile_paths, good_lighting, lowered_curb, platform_elevator, crutches_friendly, sign_language_interpreter, assistance_dog_allowed, elevator_entrance, wide_doors, automatic_doors, call_bell, spacious_interior, high_contrast_info, tactile_info, escalator, adult_changing_table, turning_space, extra_accessible_toilets, high_contrast_markings, accessible_digital_materials, audio_description, video_captions, fm_system, disabled_parking, marked_parking, level_surface, more_than_n_spots, drop_off_zone, pets_allowed, baby_changing_table, stroller_space, rest_areas, luggage_storage]
      description: Subset of full FeatureKey (35 values)
    FeatureGroupKey:
      type: string
      enum: [entrance, inside, toilet, hearing, vision, mobility, parking, other]
    FeatureStateValue:
      type: string
      enum: ["yes", partial, "no", not_applicable, unknown]
      description: Full enum also has partial (cut in MVP)
    ObservationSource:
      type: string
      enum: [community, verified_owner, admin]
      description: Subset used in MVP
    ValidationStatus:
      type: string
      enum: [VALID, CONFLICT, REJECTED]
    NeedsProfile:
      type: string
      enum: [wheelchair, crutches, stroller, blind, low_vision, deaf, assistance_dog]
    Location:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number }
        lon: { type: number }
    Category:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
    PlaceSummary:
      type: object
      required: [id, name, location]
      properties:
        id: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        location: { $ref: "#/components/schemas/Location" }
        accessibility_summary:
          type: array
          items: { $ref: "#/components/schemas/FeatureKey" }
          description: Features with state yes
    Place:
      allOf:
        - { $ref: "#/components/schemas/PlaceSummary" }
        - type: object
          properties:
            short_description: { type: string }
    PlacePage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PlaceSummary" } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    FeatureState:
      type: object
      required: [key, state]
      properties:
        key: { $ref: "#/components/schemas/FeatureKey" }
        label: { type: string }
        state: { $ref: "#/components/schemas/FeatureStateValue" }
        temporary: { type: boolean }
        confidence: { type: number, minimum: 0, maximum: 1 }
        last_verified: { type: [string, "null"], format: date-time }
        sources_count: { type: integer }
        validation: { $ref: "#/components/schemas/ValidationStatus" }
        active_observation_id: { type: [string, "null"] }
    Accessibility:
      type: object
      properties:
        place_id: { type: string }
        groups:
          type: array
          items:
            type: object
            properties:
              key: { $ref: "#/components/schemas/FeatureGroupKey" }
              label: { type: string }
              features: { type: array, items: { $ref: "#/components/schemas/FeatureState" } }
    CheckResult:
      type: object
      required: [place_id, profile, answer]
      properties:
        place_id: { type: string }
        profile: { $ref: "#/components/schemas/NeedsProfile" }
        answer:
          type: string
          enum: ["yes", partial, "no", not_applicable, unknown]
          description: Full enum also has likely_yes (cut in MVP)
        confidence: { type: number }
        reasons:
          type: array
          items:
            type: object
            properties:
              feature: { $ref: "#/components/schemas/FeatureKey" }
              state: { $ref: "#/components/schemas/FeatureStateValue" }
        active_issues:
          type: array
          items:
            type: object
            properties:
              observation_id: { type: string }
              feature: { $ref: "#/components/schemas/FeatureKey" }
              temporary: { type: boolean }
              comment: { type: string }
        advice: { type: string }
