[project]
name = "rampa-backend"
version = "0.1.0"
description = "Kraków bez barier — MVP backend (FastAPI, hexagonal, in-memory)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "google-auth>=2.30",
    "requests>=2.32",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
ai = [
    "huggingface-hub>=0.25",
    "onnxruntime-genai>=0.17",
]
mcp = ["fastmcp>=2.10"]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6.0.3",
]
